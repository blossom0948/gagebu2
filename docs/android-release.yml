name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle Wrapper to run
        run: chmod +x ./gradlew

      - name: Restore Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moasseum-upload.jks"

      - name: Test and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/moasseum-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew testDebugUnitTest lintDebug bundleRelease assembleRelease
          -PVERSION_CODE=${{ github.run_number }}
          -PVERSION_NAME=0.1.${{ github.run_number }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "${{ github.sha }}" \
            --title "모아씀 $TAG" \
            --generate-notes

# This file is intentionally kept under docs/ until the repository token has
# the GitHub Actions workflow scope. Move it to .github/workflows/ after that
# scope is granted. Google Play publication can then be added with a Play
# Console service-account secret; GitHub Releases alone cannot silently update
# an Android installation.
